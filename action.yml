name: "Sync to Athena"
description: "Bidirectional GitHub <-> Athena sync: create tickets from issues, link PRs to their matching task, append comments as child notes. Runs the sync-athena image built by the internal GitLab pipeline."
author: "hahihula"

inputs:
  athena_project_uuid:
    description: "Athena project UUID."
    required: true
  athena_db_path:
    description: "Athena database path."
    required: true
  athena_base_url:
    description: "Athena base URL."
    required: true
  athena_token:
    description: "Athena API token."
    required: true
  mode:
    description: "Which sync flow to run: 'issue_to_task', 'comment_to_task', or 'pr_to_comment'."
    required: true
  ticket_prefix:
    description: "Ticket key prefix (e.g. 'EIM', 'ESP'). Combined with the GitHub issue number to form the ticket key: issue #1044 becomes EIM-1044. Required — no default, to prevent silently filing tickets in the wrong project."
    required: true
  issue_number:
    description: "Override issue number (for workflow_dispatch backfill)."
    required: false
  issue_title:
    description: "Override issue title (for workflow_dispatch backfill)."
    required: false
  issue_body:
    description: "Override issue body (for workflow_dispatch backfill)."
    required: false
  repo:
    description: "owner/repo slug for gh CLI calls (e.g. espressif/idf-im-ui)."
    required: true
  github_token:
    description: >
      Token for the gh CLI calls that comment on and label the issue, and that read
      issue titles during a backfill. Defaults to the workflow's own GITHUB_TOKEN;
      the calling job needs `permissions: issues: write`.
    required: false
    default: ${{ github.token }}
  event_path:
    description: "Path to GitHub event JSON; defaults to $GITHUB_EVENT_PATH."
    required: false
  tasks_folder:
    description: "Athena folder name where tickets are filed."
    required: false
    default: "📝 Tasks"
  author:
    description: >
      Leave empty (recommended). Athena stores this string verbatim as the node's
      author and then checks the *caller* against it on every later write, so any
      value that isn't exactly the identity your athena_token authenticates as
      locks the action out of the node it just created (403 on tags and
      collaborators). Empty means "whoever this token is" — the server fills it in.
    required: false
    default: ""
  editors:
    description: "Comma-separated list of editor emails set on the created task (issue_to_task mode)."
    required: false
    default: ""
  co_authors:
    description: "Comma-separated list of co-author emails added to the created task (issue_to_task mode). Existing collaborators are kept."
    required: false
    default: ""
  email_domain:
    description: "Domain used to expand bare usernames in 'editors'/'co_authors' (e.g. 'espressif.com'). Entries already containing '@' are left alone."
    required: false
    default: ""
  registry:
    description: "Internal Docker registry hosting the sync-athena image."
    required: false
    default: "gitlab.espressif.cn:5050"
  image:
    description: "Registry path of the sync-athena image, without tag. Built by the idf/sync-athena GitLab pipeline."
    required: false
    default: "gitlab.espressif.cn:5050/idf/sync-athena"
  image_tag:
    description: "Tag of the sync-athena image to pull."
    required: false
    default: "latest"
  registry_username:
    description: "Username for docker login to the internal registry."
    required: true
  registry_token:
    description: "Token/password for docker login to the internal registry. Pass this from a secret — never hardcode it in a workflow file."
    required: true

runs:
  using: "composite"
  steps:
    - name: Log in to internal registry
      shell: bash
      env:
        _REGISTRY: ${{ inputs.registry }}
        _USERNAME: ${{ inputs.registry_username }}
        _TOKEN: ${{ inputs.registry_token }}
      run: echo "$_TOKEN" | docker login "$_REGISTRY" --username "$_USERNAME" --password-stdin

    - name: Pull sync-athena image
      shell: bash
      env:
        _IMAGE: ${{ inputs.image }}
        _TAG: ${{ inputs.image_tag }}
      run: docker pull "${_IMAGE}:${_TAG}"

    - name: Run sync-athena
      shell: bash
      env:
        _IMAGE: ${{ inputs.image }}
        _TAG: ${{ inputs.image_tag }}
        MODE: ${{ inputs.mode }}
        REPO: ${{ inputs.repo }}
        EVENT_PATH: ${{ inputs.event_path }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ISSUE_TITLE: ${{ inputs.issue_title }}
        ISSUE_BODY: ${{ inputs.issue_body }}
        ATHENA_PROJECT_UUID: ${{ inputs.athena_project_uuid }}
        ATHENA_DB_PATH: ${{ inputs.athena_db_path }}
        ATHENA_BASE_URL: ${{ inputs.athena_base_url }}
        ATHENA_TOKEN: ${{ inputs.athena_token }}
        ATHENA_TICKET_PREFIX: ${{ inputs.ticket_prefix }}
        ATHENA_TASKS_FOLDER: ${{ inputs.tasks_folder }}
        ATHENA_AUTHOR: ${{ inputs.author }}
        ATHENA_EDITORS: ${{ inputs.editors }}
        ATHENA_CO_AUTHORS: ${{ inputs.co_authors }}
        ATHENA_EMAIL_DOMAIN: ${{ inputs.email_domain }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        # EVENT_PATH defaults to $GITHUB_EVENT_PATH; both it and $GITHUB_OUTPUT
        # live under $RUNNER_TEMP, which is bind-mounted below so the container
        # sees them at the same host paths.
        [ -z "$EVENT_PATH" ] && EVENT_PATH="$GITHUB_EVENT_PATH"
        docker run --rm \
          -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -e MODE -e REPO -e EVENT_PATH -e ISSUE_NUMBER -e ISSUE_TITLE -e ISSUE_BODY \
          -e ATHENA_PROJECT_UUID -e ATHENA_DB_PATH -e ATHENA_BASE_URL -e ATHENA_TOKEN \
          -e ATHENA_TICKET_PREFIX -e ATHENA_TASKS_FOLDER -e ATHENA_AUTHOR \
          -e ATHENA_EDITORS -e ATHENA_CO_AUTHORS -e ATHENA_EMAIL_DOMAIN \
          -e GITHUB_TOKEN -e GITHUB_OUTPUT \
          "${_IMAGE}:${_TAG}"
