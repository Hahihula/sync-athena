name: "Sync to Athena"
description: "Bidirectional GitHub <-> Athena sync: create tickets from issues, link PRs to their matching task, append comments as child notes."
author: "hahihula"

inputs:
  athena_project_uuid:
    description: "Athena project UUID."
    required: true
  athena_db_path:
    description: "Athena database path."
    required: true
  athena_base_url:
    description: "Athena base URL."
    required: true
  athena_token:
    description: "Athena API token."
    required: true
  mode:
    description: "Which sync flow to run: 'issue_to_task', 'comment_to_task', or 'pr_to_comment'."
    required: true
  ticket_prefix:
    description: "Ticket key prefix (e.g. 'EIM', 'ESP'). Used for task naming, hashtag, labels, and PR title parsing. Required — no default, to prevent silently filing tickets in the wrong project."
    required: true
  issue_number:
    description: "Override issue number (for workflow_dispatch backfill)."
    required: false
  issue_title:
    description: "Override issue title (for workflow_dispatch backfill)."
    required: false
  issue_body:
    description: "Override issue body (for workflow_dispatch backfill)."
    required: false
  repo:
    description: "owner/repo slug for gh CLI calls (e.g. espressif/idf-im-ui)."
    required: true
  event_path:
    description: "Path to GitHub event JSON; defaults to $GITHUB_EVENT_PATH."
    required: false
  tasks_folder:
    description: "Athena folder name where tickets are filed."
    required: false
    default: "📝 Tasks"
  author:
    description: "Author email written into the created nodes."
    required: false
    default: "github-actions@users.noreply.github.com"
  editors:
    description: "Comma-separated list of editor emails set on the created task (issue_to_task mode)."
    required: false
    default: ""
  co_authors:
    description: "Comma-separated list of co-author emails set on the created task (issue_to_task mode)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install httpx>=0.27 markdown-it-py>=3.0
        # Action source is vendored alongside the workflow; PYTHONPATH picks it up.
        echo "PYTHONPATH=${GITHUB_ACTION_PATH}/src${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

    - name: Sync issue -> Athena task
      if: inputs.mode == 'issue_to_task'
      shell: bash
      env:
        ATHENA_PROJECT_UUID: ${{ inputs.athena_project_uuid }}
        ATHENA_DB_PATH: ${{ inputs.athena_db_path }}
        ATHENA_BASE_URL: ${{ inputs.athena_base_url }}
        ATHENA_TOKEN: ${{ inputs.athena_token }}
        ATHENA_TICKET_PREFIX: ${{ inputs.ticket_prefix }}
        ATHENA_TASKS_FOLDER: ${{ inputs.tasks_folder }}
        ATHENA_AUTHOR: ${{ inputs.author }}
        ATHENA_EDITORS: ${{ inputs.editors }}
        ATHENA_CO_AUTHORS: ${{ inputs.co_authors }}
        _REPO: ${{ inputs.repo }}
        _EVENT_PATH: ${{ inputs.event_path }}
        _ISSUE_NUMBER: ${{ inputs.issue_number }}
        _ISSUE_TITLE: ${{ inputs.issue_title }}
        _ISSUE_BODY: ${{ inputs.issue_body }}
      run: |
        args=(--repo "$_REPO")
        [ -n "$_EVENT_PATH" ] && args+=(--event "$_EVENT_PATH")
        [ -n "$_ISSUE_NUMBER" ] && args+=(--issue-number "$_ISSUE_NUMBER")
        [ -n "$_ISSUE_TITLE" ] && args+=(--issue-title "$_ISSUE_TITLE")
        [ -n "$_ISSUE_BODY" ] && args+=(--issue-body "$_ISSUE_BODY")
        python -m sync_athena.issue_to_task "${args[@]}"

    - name: Sync comment -> Athena task
      if: inputs.mode == 'comment_to_task'
      shell: bash
      env:
        ATHENA_PROJECT_UUID: ${{ inputs.athena_project_uuid }}
        ATHENA_DB_PATH: ${{ inputs.athena_db_path }}
        ATHENA_BASE_URL: ${{ inputs.athena_base_url }}
        ATHENA_TOKEN: ${{ inputs.athena_token }}
        ATHENA_TICKET_PREFIX: ${{ inputs.ticket_prefix }}
        ATHENA_AUTHOR: ${{ inputs.author }}
        _EVENT_PATH: ${{ inputs.event_path }}
      run: |
        args=()
        [ -n "$_EVENT_PATH" ] && args+=(--event "$_EVENT_PATH")
        python -m sync_athena.comment_to_task "${args[@]}"

    - name: Sync PR -> Athena comment
      if: inputs.mode == 'pr_to_comment'
      shell: bash
      env:
        ATHENA_PROJECT_UUID: ${{ inputs.athena_project_uuid }}
        ATHENA_DB_PATH: ${{ inputs.athena_db_path }}
        ATHENA_BASE_URL: ${{ inputs.athena_base_url }}
        ATHENA_TOKEN: ${{ inputs.athena_token }}
        ATHENA_TICKET_PREFIX: ${{ inputs.ticket_prefix }}
        ATHENA_AUTHOR: ${{ inputs.author }}
        _EVENT_PATH: ${{ inputs.event_path }}
      run: |
        args=()
        [ -n "$_EVENT_PATH" ] && args+=(--event "$_EVENT_PATH")
        python -m sync_athena.pr_to_comment "${args[@]}"
